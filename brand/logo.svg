  <path d="M0 432 Q 64 402 128 432 T 256 432 T 384 432 T 512 432 V 512 H 0 Z" fill="#fbfaf7"/>
  <path d="M0 466 Q 64 436 128 466 T 256 466 T 384 466 T 512 466 V 512 H 0 Z" fill="#1d4f91"/>
  <text x="256" y="300" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="270" font-weight="700" fill="#fbfaf7" text-anchor="middle">K</text>
