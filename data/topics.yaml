# Topics for browsing, used by scripts/build_site.py.
#
# An entry belongs to a topic when one of its definitions (not examples or
# cross-references) has a keyword among its first six words (or `within:` words),
# e.g. "a species of fish" or "fish." but not "to fish for flying fish".
# Plurals match too.
# A topic with `source:` instead lists every entry that source contributes to.
# This is a browsing aid, not part of the dictionary text: edit freely.

