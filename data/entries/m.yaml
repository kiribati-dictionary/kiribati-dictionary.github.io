- id: man
  headword: man
  trussel: man
  sources:
  - source: bingham
    forms:
    - form: mæn
      parts:
      - label: pre.
        text: from (it becomes *mani* before m, b, k).
      - label: n.
        text: flag.
      - label: n.
        text: animal, bird.
      - label: n.
        text: messenger.
    - form: man
      parts:
      - label: a.
        text: suffix following the digits in counting persons and animals.
    - form: maan
      parts:
      - label: n.
        text: custom.
  - source: sabatier
    forms:
    - form: man
      parts:
      - label: prep.
        text: from (latin ex).
      - label: ex.
        text: |-
          *i uotia man te kawa*: I brought it from the village.
          *uoua man aua*: two from four.
      - label: see
        text: '[[mai]], [[ma]].'
    - form: man
      homograph: 1
      parts:
      - label: n.
        text: animal, beast, insect, etc.
      - label: ex.
        text: |-
          *te man ae kakang*: a wild animal *te man n uma*: a tame animal.
          *man n eta*: a land animal.
          *man n ta-ri*: a sea creature.
          *man aika ai waeia*: quadrupeds.
          *man aika a mamma*: mammals.
          *man ni kiba*: birds.
          *man aika pingingi*: insects.
          *man aika tingingi*: insects.
          *man aon te ora*:... found at low tide on beach.
          *man aika a nana*: shell fish, crabs in shells.
          *man aika manana*: domestic animals.
      - label: vt.
        text: '*mani-manina, manina, mamanina*: to have... to rear, to own an animal.'
      - label: n.
        text: '*te tia maniman*: stock breeder, animal lover.'
    - form: man
      homograph: 2
      parts:
      - label: suf.
        text: to cardinal numbers for persons, animals, small- and medium-sized fish.
      - label: ex.
        text: |-
          *onoman te aomata*: six persons.
          *uoman te tarabuti*: two sardines.
    - form: man
      homograph: 3
      parts:
      - label: n.
        text: messenger, delegate, deputy, representative, ambassador.
      - label: ex.
        text: '*ana man te Pope*: the Pope''s delegate.'
    - form: man
      homograph: 4
      parts:
      - label: n.
        text: sign, letter, flag, standard, omen.
      - label: ex.
        text: '*te man teuana, te man uoua*: standard of clan flown on canoes.'
      - label: vt.
        text: '*manina*: to take as one''s flag, standard, banner.'
      - label: see
        text: '*manimania*, *bomania*, [[tamania]], [[uamania]].'
    - form: man
      homograph: 5
      parts:
      - label: n.
        text: long duration, long time, fairly long period of time.
      - label: a.
        text: lasting a long time.
      - label: v.
        text: to stay or be a long time.
      - label: ex.
        text: |-
          *e aki man i mwin nakona*: it is not long since he left.
          *e a kaman roko*: he arrived, came a long time ago.
      - label: vc.
        text: '*ka-mana*: to prolong the time, to stay a long time, to make last.'
    - form: Man
      parts:
      - label: n.
        text: a star, Canopus.
    - form: man
      homograph: 6
      parts:
      - label: n.
        text: behaviour, custom, habit, manner, fashion, style.
      - label: ex.
        text: |-
          *aia man ikawai*: the customs of the ancients.
