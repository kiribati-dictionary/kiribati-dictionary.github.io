  - source: sabatier
    forms:
    - form: mwinta
      parts:
      - label: n.
        text: an abandoned place, left desolate, quitted temporarily.
      - label: idiom.
        text: '*tiku i mwinta*: stay alone in a house when others have left.'
      - label: vt.
        text: '*mwintaea*: to leave behind alone in house or village.'
      - label: ex.
        text: '*i mwintaeaki*: I am left alone after all have gone.'
      - label: vc.
