- id: m
  headword: m
  trussel: m
  sources:
  - source: bingham
    forms:
    - form: m
      parts:
      - label: pron.
        text: thy.
      - label: ex.
        text: '*baim* thy hand.'
  - source: sabatier
    forms:
    - form: m
      parts:
      - label: suf.
        text: 'pron. of second person singular: thy, thine. <your>.'
      - label: ex.
        text: |-
          *baram*: thy hat.
          *baim*: thy hand.
          *kunnikaim*: thy clothes.
- id: ma
  headword: ma
  trussel: ma
  sources:
  - source: bingham
    forms:
    - form: ma
      parts:
      - label: a.
        text: this word is identical in use with the Hawaiian word *ma*, of which Mr. Andrews says in
          his Hawaiian-English dictionary, " an adj or a particle, which mostly follows proper names of
          persons, and signifies an attendant, or persons belonging to or accompanying".
      - label: pre.
        text: with.
      - label: con.
        text: but - *ma* sometimes seems to have the force of therefore.
      - label: n.
        text: low stone wall on a flat for catching fish.
    - form: m'a
      parts:
      - label: int.
        text: exclamation of dissatisfaction or surprise.
      - label: vi.
        text: fall as a hair or leaf, or a feather in a moulting fowl.
  - source: sabatier
    forms:
    - form: ma
      parts:
      - label: conj.
        text: with, and, but.
      - label: ex.
        text: |-
          *N na toka ma ngaia*: I will ride with him.
          *ngai ma taru*: I and my brother.
          *E nako ma ko tiku*: He goes but you remain.
      - label: part.
        text: following proper names of persons and meaning, and their relatives, family or followers.
      - label: ex.
        text: |-
          *Petero, Anterea ma*: Peter and Andrew and the others.
          *Ten Teta ma*: Ten Teta and family.
    - form: ma
      homograph: 1
      parts:
      - label: n.
        text: |-
          a fish trap, made of stones, heart shaped.
          *ma bono*: a temporary fish trap made of mats (*inai*) tied to posts at high tide.
      - label: ex.
        text: '*ma-uoua*: a double *ma*, two enclosures of stones.'
      - label: v.
        text: |-
          *touma*: to inspect fish trap at low tide to take fish.
          *ai-ma*: to construct a fish trap.
      - label: n.
        text: '*kanan te ma*: foundation stone of *ma*.'
      - label: ex.
        text: 'names of different parts of fish trap: *waena, kabina, angana, tabonangana, matakaina,
          katabena, ruberubena, karuona*.'
      - label: n.
        text: '*ana ma Kabaki*.'
    - form: ma
      homograph: 2
      parts:
      - label: intj.
        text: pooh, pshaw, nonsense (to show surprise, displeasure).
    - form: ma
      homograph: 3
      parts:
      - label: abbr.
        text: 'of *mane*: men.'
      - label: ex.
        text: '*kam aki iri ma?*: aren''t you coming gentlemen?'
    - form: ma
      homograph: 4
      parts:
      - label: pref.
        text: to some nouns to give the meaning of a little, barely, as if, inclined to.
      - label: ex.
        text: '*manim, maeai, mao, matim*, etc.'
    - form: ma
      homograph: 5
      parts:
      - label: v.
        text: to disaggregate, to break up, to fall to pieces, to crumble away, to moult, to come off
          in scales (leaves, fruit, hair, food).
      - label: red.
        text: '*m''am''a*.'
      - label: n.
        text: '*te m''a, m''am''an te*... disaggregation, decomposition, stripping.'
