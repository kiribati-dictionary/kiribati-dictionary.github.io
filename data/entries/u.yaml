- id: u
  headword: u
  trussel: u
  sources:
  - source: bingham
    forms:
    - form: u
      parts:
      - label: n.
        text: trap to catch eels <fishing>.
      - label: pron.
        text: my.
      - label: ex.
        text: '*baiu*: my hand.'
      - label: vi.
        text: go in great numbers, swarm about.
      - label: vi.
        text: fish for eels with an *u*.
  - source: sabatier
    forms:
    - form: u
      parts:
      - label: suf.
        text: to nouns indicating poss. adj. 1st person.
      - label: ex.
        text: '*tina-u*: my mother; *bai-u*: my hand, my arm.'
    - form: u
      homograph: 1
      parts:
      - label: pref.
        text: |-
          to most words beginning with *u*.
          meaning up, upwards, lifting up, rising <rise> up.
      - label: see
        text: '[[u]], [[uba]], [[ubu]], [[uka]], [[uki]], [[uma]], [[unga]], [[taura|ta-ura]], [[uti]],
          [[ure]].'
    - form: u
      homograph: 2
      parts:
      - label: n.
        text: onomatopoeia of persisting noise.
      - label: see
        text: '[[kareu]], [[karu]], [[karou]].'
    - form: u
      homograph: 3
      parts:
      - label: n.
        text: a humming noise, buzzing,... of crowd, of wind.
      - label: v.
        text: to roar, to rumble, to hum, to buzz in swarms.
      - label: a.
        text: abounding, crawling, pollinating <pollinate>.
      - label: ex.
        text: '*e u te maninara*: the mosquitoes are swarming and buzzing.'
    - form: u
      homograph: 4
      parts:
      - label: n.
        text: '*te u, to u*: eel basket, eel pot.'
      - label: v.
        text: '*u*: to fish for...'
      - label: ex.
        text: |-
          *tao-u*: to fix the eel basket, to put it down to sea bottom.
          *tae-u*: to make eel basket.
          *taona te u*: to put down...
          *taeko te u*: to pull up...
      - label: nv.
        text: '*ka-u, kauai, kau kamakama, kau waro*, etc.: to fish for crabs, *kamakama*, sea mantis,
          etc., by alluring <allure> them, enticing <entice> them (*ka-u*).'
    - form: u
      homograph: 5
      parts:
      - label: n.
        text: perforation.
      - label: v.
        text: to perforate, to pierce.
      - label: ex.
        text: |-
          *te bai n u*: ancient gimlet of pointed shell.
          *te u-baba*: brace drill.
      - label: vt.
        text: '*una*: to pierce, to perforate with brace bit.'
    - form: u
      homograph: 6
      parts:
      - label: n.
        text: '*te u*: a skin disease (which makes holes).'
- id: ua
  headword: ua
  trussel: ua
  sources:
  - source: bingham
    forms:
    - form: úa
      parts:
      - label: n.
        text: fishing in deep water in which a number of persons accompany or manage the seine by swimming
          <fishing>.
      - label: vi.
        text: swim, fish <fishing>.
    - form: uá
      parts:
      - label: a.
        text: two, used in counting tens, hundreds, thousands, etc, days and years.
      - label: see
        text: '[[a]] (for numeral suffixes).'
      - label: vt.
        text: await the night or sunset.
    - form: uaa
      parts:
      - label: n.
        text: fruit.
      - label: vi.
        text: bear fruit.
  - source: sabatier
    forms:
    - form: ua
      parts:
      - label: a.
        text: 'two, in compound words: *ua-kora, ua ngaun, ua-bubua*.'
    - form: ua
      homograph: 1
      parts:
      - label: a.
        text: two, when counting in pairs, by two's.
    - form: ua
      homograph: 2
      parts:
      - label: v.
        text: rad. of *uota* in compound words to have on oneself, to carry on oneself.
      - label: ex.
        text: '*ua-kai, ua bai*: to carry arms...'
    - form: ua
      homograph: 3
      parts:
      - label: v.
        text: 'rad. of *uaua*: to swim.'
      - label: ex.
        text: '*ua rio, uarake, ua nako*: to swim down,... up, away.'
      - label: n.
        text: '*te ua*: a manner of fishing with net in deep water.'
      - label: vc.
        text: '*ka-uaua*: to make swim.'
      - label: see
        text: 'v.t. [[uana]]: to swim to,... towards.'
    - form: ua
      homograph: 4
      parts:
      - label: n.
        text: measure, manner.
      - label: idiom.
        text: '*uau naba, uam naba*: me also, you also.'
      - label: ex.
        text: |-
          *uana naba*: in the same way, and so on.
          *uau aei i tari*: the water was up to here (show) on me in the sea.
          *akea uam*: there's nobody like you, nobody your size.
    - form: ua
      homograph: 5
      parts:
      - label: v.
        text: to wait until, have patience till, insist until, remain until...
      - label: ex.
        text: |-
          *ti ua rekena*: we will wait till we get it.
          *e ua matena*: he kept at it till death.
          *n ua te*: until.
          *n ua matena*: even until death...
      - label: vt.
        text: '*ka-ua*: in a state of waiting, of patiently waiting, until...'
      - label: ex.
        text: '*kauako, kauangkami*.'
      - label: ex.
        text: |-
          *kauangkami i main te ongora*: have patience while waiting for the address.
          *kaua te ongora*: wait until the...
          *kaua matum*: wait till it is time to go to bed.
          *kauai nanomi*: be patient! you will get satisfaction!
      - label: intj.
        text: '*ua reke! ua roko! ua rongo!* (ironical) let it come! what odds!'
    - form: ua
      homograph: 6
      parts:
      - label: n.
        text: '*te ua, uan te*...: fruit, product, result, gain, profit.'
      - label: ex.
        text: |-
          *te ua ni, uan te ni*: fruit of coconut tree; te ben: coconut.
          *te moan ua*: the first fruit.
          *akea uana*: without profit,... value.
      - label: v.
        text: '*kariki ua*: to give fruit, profits, results.'
      - label: nv.
        text: '*kinika ua*: to gather,... pull fruit.'
      - label: vc.
        text: '*kauaea*: to make..., to let produce fruit,... profit.'
