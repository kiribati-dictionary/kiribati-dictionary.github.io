    forms:
    - form: botunga
      parts:
      - label: from.
        text: '[[boti]].'
      - label: red.
        text: '*bobotunga*.'
      - label: n.
        text: assembly.
      - label: a.
        text: careful, orderly.
      - label: vt.
        text: '*botunga*: to arrange, to classify, to set in order, to put in its place.'
      - label: see
        text: '[[botua]].'
- id: boturuma
  headword: boturuma
  trussel: boturuma
  sources:
  - source: bingham
    forms:
    - form: boturúm'a
      parts:
      - label: vt.
        text: to close or shut up, as a house.
      - label: n.
        text: a canoe with a watertight deck in the bows.
  - source: sabatier
    forms:
    - form: boturuma
      parts:
      - label: n.
        text: a box with a lid, a canoe with pointed bow.
- id: bou
  headword: bou
  trussel: bou
  sources:
  - source: bingham
    forms:
    - form: bóu
      parts:
      - label: n.
        text: the upper part of a canoe-mast.
    - form: boóu
      parts:
      - label: va.
        text: abounding as fish in a place unfrequented.
  - source: sabatier
    forms:
    - form: bou
      parts:
      - label: a.
        text: swarming, crawling.
      - label: see
        text: '[[u]].'
    - form: bou
      homograph: 1
      parts:
      - label: ew.
        text: '*fou*.'
      - label: a.
        text: new, recent, novel.
      - label: vc.
        text: '*kaboua*: to make anew, to find novel, to use for the first time, etc.'
      - label: see
        text: '[[menai]].'
    - form: bou
      homograph: 2
      parts:
      - label: n.
        text: top of the main yard arm.
      - label: vt.
        text: '*boua te ie*: to tie the sail to yard.'
      - label: ex.
        text: '*tae boua te ie*: to detach, to untie sails from yard arm.'
    - form: bou
      homograph: 3
      parts:
      - label: n.
        text: construction.
      - label: v.
        text: '*bobou*. to construct.'
      - label: vt.
        text: '*boua, boboua*: to construct (canoes, ships, framework, etc.).'
    - form: bou
      homograph: 4
      parts:
      - label: nv.
        text: travel.
      - label: ex.
        text: '*kain te bou*: travellers, members of voyage, passengers, travelling companions.'
- id: boua
  headword: boua
  trussel: boua
  sources:
  - source: bingham
    forms:
    - form: bóua
      parts:
      - label: vt.
        text: to build a new canoe.
      - label: n.
        text: a post, a pillar, a spirit stone, an idol.
    - form: bóuaa
      parts:
      - label: vt.
        text: to split, or cut into halves, as a coconut or *babai*.
    - form: boóua
      parts:
      - label: n.
        text: a dry coconut husk.
  - source: sabatier
    forms:
    - form: Boua
      parts:
      - label: n.
        text: '*Na Boua* (Arcturus?) <star>.'
    - form: boua
      parts:
      - label: n.
        text: 1. a pillar, a post, a stake, a prop, a column.
      - label: ex.
        text: |-
          *te boua n anti*: a stone idol (standing up).
          *kain te boua n anti*: adherents of idol.
          *te kare boua*: offerings made to idols.
      - label: n.
        text: |-
          2. *te kare boua*: game of skittles.
          3. a game like leap frog.
    - form: boua
      homograph: 1
      parts:
      - label: n.
        text: coconut husk used as firewood.
      - label: vt.
        text: to cut in two, to throw down violently.
      - label: ex.
        text: '*e un ao e bouaia raona*: he was cross and threw his companion violently on the ground
          (as if to break him in two).'
- id: bouakina
  headword: bouakina
  trussel: bouakina
  sources:
  - source: sabatier
    forms:
    - form: bouakina
      parts:
      - label: vt.
        text: to work at construction of...
      - label: syn.
        text: '[[boua]].'
- id: bouriki
  headword: bouriki
  trussel: bouriki
  sources:
  - source: sabatier
    forms:
    - form: bouriki
      parts:
      - label: n.
        text: 1. a prop supporting the middle of the top *okai* in ancient *maneaba* construction.
      - label: n.
        text: 2. the posts resting on horizontal beams and supporting the top beam of houses and small
          *maneaba*.
- id: bouru
  headword: bouru
  trussel: bouru
  sources:
  - source: bingham
    forms:
    - form: bóuru
      parts:
      - label: n.
        text: the spirit-land.
  - source: sabatier
    forms:
    - form: Bouru
      parts:
      - label: n.
        text: land of ancestors where souls of dead return.
      - label: note.
        text: perhaps Polulu in Mollucas.
      - label: n.
        text: '*te aomata mai Bouru*; a stranger just arrived, whose country is not known.'
      - label: ex.
        text: '*te tia Bouru*: a fierce warrior, implacable.'
- id: bourua
  headword: bourua
  trussel: bourua
  sources:
  - source: sabatier
    forms:
    - form: bourua
      parts:
      - label: vt.
        text: '*bouruakina, baneakina*. to get together to do something.'
      - label: ex.
        text: '*tera are kam bouruakina?*: what are you all plotting?'
    - form: bourua
      homograph: 1
      parts:
      - label: vt.
        text: to break, to spoil by hitting on.
- id: boutabu
  headword: boutabu
  trussel: boutabu
  sources:
  - source: bingham
    forms:
    - form: bóutabu
      parts:
      - label: n.
        text: a center post for a ridge-pole.
  - source: sabatier
    forms:
    - form: boutabu
      parts:
      - label: or.
        text: '[[boitabu]].'
      - label: n.
        text: '*te bou ae tabu*. the pillar in middle of *maneaba* supporting top beam (*taubuki*).'
      - label: ex.
        text: '*te boutabu n nuka*: the pillar placed exactly in middle of construction and supporting
          the *taubuki*, from it all the measurements were taken by strings stretched from it.'
- id: boutabunnuka
  headword: boutabunnuka
  trussel: boutabunnuka
  sources:
  - source: bingham
    forms:
    - form: bóutabunnúka
      parts:
      - label: n.
        text: a central post supporting the ridge-pole.
- id: boutokana
  headword: boutokana
  trussel: boutokana
  sources:
  - source: sabatier
    forms:
    - form: boutokana
      parts:
      - label: from.
        text: '[[boua]] and [[tokoa]].'
      - label: vt.
        text: to use a beam to serve as a support.
- id: boutokoa
  headword: boutokoa
  trussel: boutokoa
  sources:
  - source: sabatier
    forms:
    - form: boutokoa
      parts:
      - label: vt.
        text: to prop, to support with a post.
- id: boutowa
  headword: boutowa
  trussel: boutowa
  sources:
  - source: sabatier
    forms:
    - form: Boutowa
      parts:
      - label: n.
        text: name of a spirit (*anti*), vagabond.
    - form: boutowa
      parts:
      - label: n.
        text: a vagabond, vagrancy.
      - label: v.
        text: to rove ceaselessly.
- id: bowi
  headword: bowi
  trussel: bowi
  sources:
  - source: sabatier
    forms:
    - form: bowi
      parts:
      - label: and
        text: '[[kabowi]].'
      - label: n.
        text: a deliberating assembly, council meeting, conference, court.
      - label: v.
        text: to come together to deliberate, to judge.
      - label: vt.
        text: '*bowia, bobowia, kabowia*: to deliberate on, to consult together, to examine a case, to
          judge.'
      - label: vc.
        text: '*kabowia*: to come together to examine, to deliberate on...'
- id: bu
  headword: bu
  trussel: bu
  sources:
  - source: bingham
    forms:
    - form: bu
      parts:
      - label: n.
        text: |-
          a spouse when followed by the suffix pronoun, a relative when preceded by the possessive pronoun.
          a conch-shell, a trumpet.
      - label: va.
        text: in bud, budding.
      - label: a.
        text: cowardly, satiated.
  - source: sabatier
    forms:
    - form: bu
      parts:
      - label: n.
        text: a conch, sea shell horn, trumpet, instrument of brass band.
      - label: ex.
        text: |-
          *e tang te bu*: the conch sounds, the band plays.
          *katanga te bu*: sound the conch..., horns, play the trumpet.
      - label: pref.
        text: root of [[buta]], [[burita]].
      - label: see
        text: compound words -- [[bu-ira]], [[bukakoko]], etc.
    - form: bu
      homograph: 2
      parts:
      - label: nv.
        text: odour, smell.
      - label: ex.
        text: '*e bu ika*: it smells fish.'
      - label: note.
        text: is used as prefix root to certain number of compound words with the same meaning as *boi*.
    - form: bu
      homograph: 3
      parts:
      - label: n.
        text: near relative, near relations.
      - label: ex.
        text: '*au bu, am bu, ana bu*, etc.: my relations, your relations, etc.'
    - form: bu
      homograph: 4
      parts:
      - label: n.
        text: spouse, husband, wife.
      - label: ex.
        text: |-
          *bu*: my husbandwife.
          *bum*: your husbandwife.
          *buna*: hisher wifehusband.
      - label: vt.
        text: '*buna*: to marry, to espouse, to take in marriage.'
    - form: bu
      homograph: 5
      parts:
      - label: from.
        text: '[[buta]].'
      - label: a.
        text: '*e bu, ae bu*:'
      - label: v.
        text: to come out, to come forth, to emerge, to bud.
      - label: a.
        text: uncircumcized.
      - label: ex.
        text: '*te kabu*: the bud, the shoot, the opening.'
      - label: v.
        text: '*kabu*: to make bud.'
      - label: a.
        text: budding.
      - label: see
        text: '[[butoko]], *butokauraki*, *katangi* bu: (uncircumcized).'
    - form: bu
      homograph: 6
      parts:
      - label: n.
        text: a coward, a poltroon.
      - label: see
        text: '[[biu]].'
      - label: ex.
        text: |-
          *nano bu*: discouraged.
          *kananobu*: discouraging.
      - label: v.
        text: to be full, to be filled, to be satisfied, to have enough.
      - label: ex.
        text: '*I bu*: I am full..., have eaten enough.'
- id: bu-ika
  headword: bu ika
  trussel: buika
  sources:
  - source: sabatier
    forms:
    - form: bu ika
      parts:
      - label: n.
