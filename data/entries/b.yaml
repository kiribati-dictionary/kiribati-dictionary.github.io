- id: ba
  headword: ba
  trussel: ba
  sources:
  - source: bingham
    forms:
    - form: ba
      parts:
      - label: conj.
        text: because, for, that, as.
    - form: b'a
      parts:
      - label: n.
        text: a continuous hard coral rock or ledge.
      - label: n.
        text: coconut oil, a general term for oil, a coconut shell oil bottle.
    - form: ba
      parts:
      - label: n.
        text: the midrib or main stem of the coconut frond, a leaf.
      - label: n.
        text: thunder.
      - label: n.
        text: a skin disease of infants.
    - form: b'a
      parts:
      - label: vi.
        text: to belch.
    - form: ba
      parts:
      - label: adv.
        text: just now.
      - label: ex.
        text: '*I a ba roko* I arrived just now.'
  - source: sabatier
    forms:
    - form: ba
      parts:
      - label: conj.
        text: because, so that, as, for.
      - label: ex.
        text: '*I aki nako ba I tabe*: I am not going because I am busy.'
      - label: idiom.
        text: '*akea ba...*: well, and so...'
      - label: ex.
        text: |-
          *ao ba?*: why?
          *taua ba kanam*: take as your food.
    - form: ba
      homograph: 1
      parts:
      - label: n.
        text: '*te ba*: something great, strong, powerful.'
    - form: ba
      homograph: 2
      parts:
      - label: n.
        text: thunder.
      - label: ex.
        text: '*e ruo te ba, e rurunga te ba*: the thunderbolt has fallen, the thunder roars.'
    - form: ba
      homograph: 3
      parts:
      - label: n.
        text: a big crowd.
      - label: syn.
        text: '*te runga n aomata*.'
    - form: ba
      homograph: 4
      parts:
      - label: n.
        text: rock, reef, crag, iceberg.
      - label: a.
        text: hard, solid, firm as a rock, fixed.
      - label: ex.
        text: '*e ba te wa, e ba te ang*: a mass of canoes... clouds.'
    - form: ba
      homograph: 5
      parts:
      - label: intj.
        text: '*tai ba! tai babu!* don''t say anything! don''t move!'
    - form: ba
      homograph: 6
      parts:
      - label: n.
        text: 1. oil.
      - label: ex.
        text: |-
          *te ba nikoniko*: small coconut shell used formerly as recipient for oil.
          *te ati ni ba*: small bottles for oil.
      - label: n.
        text: 2. coward.
      - label: a.
        text: cowardly.
      - label: ex.
        text: '*e ba, e bu*:'
      - label: see
        text: '[[inabaia]], to make a show of courage and run away.'
      - label: n.
        text: 3. belch.
      - label: v.
        text: to belch.
      - label: fig.
        text: n. disgust, aversion, repugnance.
      - label: vc.
        text: '*ka ba*: which disgusts, causes...'
      - label: ex.
        text: '*tai taekinna, I ba iai*: don''t talk about it, it disgusts me.'
      - label: vc.
        text: '*ka ba, kabaea*: to make or cause to belch.'
      - label: n.
        text: food which causes belching.
      - label: see
        text: '[[ba-ni-kana]].'
    - form: ba
      homograph: 7
      parts:
      - label: n.
        text: leaf, palm, midrib of palm leaf, page of paper, card, leaflet.
      - label: ex.
        text: |-
          *te bana, ua ba, teni ba*, etc.: one, two, three leaves.
          *au ba, am ba*, etc.: fig. height, rank, class, excellence.
          *bau, bam, bana*, etc.
          *ko aki rota bau*: you are not up to my rank, or worth.
          *te ba n uea*: royalty, prince.
          *te moa ni ba*: high rank.
          *te mwi ni ba*: lowest rank, vile, rejected.
      - label: a.
        text: '*baba*: leafy, branchy, luxuriant.'
      - label: ex.
        text: |-
          *ba ni kai*: leaves, leaf of tree.
          *ba n ni*: coconut leaf, palm branch <frond -- gwg>.
          *ba kabane*: top branch.
          *kakoko*: white leaf of coconut not fully developed.
      - label: syn.
        text: '[[marewe]].'
      - label: ex.
        text: |-
          *te kinati*: leaf of palm just beginning to appear.
          *te ba ni kiokio*: small leaf (of *babai, ene*).
          *te ba ni kimaimai*: a leaf not yet divided into folioles.
          *te ba raerae*: leaf already divided into folioles.
          *e iranibara te ni*: a young coconut tree with leaves already straight, long and well developed.
      - label: v.
        text: '*rae ba*: strip palm of its folioles.'
      - label: ex.
        text: |-
          *te ba*: cut off (with knife) the outside edges of midrib of palm leaf to make it even and utilizable.
          *tae ba*: tie the midribs of a leaf on; for ex. lattice.
      - label: n.
        text: '*te ba ni boki, te iteraniba*: leaf, page.'
      - label: ex.
        text: '*te ba ni kati*: playing cards, a pack of...'
    - form: ba
      homograph: 8
      parts:
      - label: n.
        text: a sickness (symptoms, violent diarrhoea).
      - label: ex.
        text: |-
          *te ba bubura*: same sickness only stronger.
          *te ba uraura*: a sickness, red patches, inflammation of vein, phlebitis.
          *te babobo*: a sickness, yellow jaundice.
    - form: ba
      homograph: 9
      parts:
      - label: a.
        text: tasteless, repugnant, repulsive.
      - label: vc.
        text: '*ka ba*: giving...'
    - form: ba
      homograph: 10
      parts:
      - label: n.
        text: '*ba akuaku* moral support, help, helpful person.'
      - label: vt.
        text: '*baakuakua*: to succour, to relieve.'
