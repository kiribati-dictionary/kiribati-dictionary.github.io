    forms:
    - form: botumaára
      parts:
      - label: va.
        text: not persevering, not persisting.
    - form: botumaára
      parts:
      - label: n.
        text: want of constancy.
  - source: sabatier
    forms:
    - form: botumara
      parts:
      - label: n.
        text: inconstancy, discouragement.
      - label: a.
        text: without perseverance, fickle, unsteady.
      - label: vt.
        text: '*kabotumara*: to cause one to be inconstant, fickle.'
      - label: ant.
        text: '*botumaka*.'
- id: botunaba
  headword: botunaba
  trussel: botunaba
  sources:
  - source: bingham
    forms:
    - form: bótunaba
      parts:
      - label: va.
        text: persevering, persisting.
- id: botunga
  headword: botunga
  trussel: botunga
  sources:
