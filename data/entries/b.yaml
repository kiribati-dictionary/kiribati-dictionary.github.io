          *e kakerikakaki, e baka au bong*: I lost a day, I missed my day.
      - label: v.
        text: |-
          *bakarake, bakario*: to go or to drift towards the east, the west side.
          *nibakabaka*: to stumble, to stagger often.
      - label: vc.
        text: '*kabaka, kabakabaka*: to make fall, to throw down, to upset, to knock down, to steer for,
          head for.'
      - label: fig.
        text: scandalize, deceive, disconcert, to foil.
      - label: ex.
        text: |-
          *kabakanano*: to discourage, to deceive.
          *ko a kabaka*: you are discouraging.
      - label: a.
        text: '*kabakaroro*: very deceptive.'
      - label: v.
        text: '*kabaka*: to disconcert.'
      - label: n.
        text: |-
          *te man ni kabaka*: deceptive manners.
          *te bai ni kabaka*: scandal.
          *te kabakabaka*: scandal giving.
      - label: idiom.
        text: '*e na baka ra?*: excuse for not giving more.'
      - label: ex.
        text: '*te kab''aka*: syrup of toddy (very thick) gets its name from the fact that it does not
