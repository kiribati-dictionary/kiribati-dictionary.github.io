  - source: sabatier
    forms:
    - form: bure
      parts:
      - label: n.
        text: a white shell, egg cowry.
      - label: sn.
        text: _Cauris, collipara)_.
      - label: ex.
        text: species -- *bure-bangaki, bure-tauti, buretewetewe...*
      - label: see
        text: '[[itua-ni-bure]], [[raiti-ni-bure]], [[namata-ni-bure]].'
      - label: vt.
        text: '*burena*: to decorate the *maneaba* with the *bure*, to fix *bure* to the *oka* of the
          *maneaba*, to bedeck, to adorn oneself with...'
    - form: bure
      homograph: 1
      parts:
      - label: n.
        text: a fault, error, defect, slip, blunder, sin, crime, offence, wrong.
      - label: ex.
        text: |-
          *te tia bure*: the culprit, the sinner, the prisoner, the accused, the criminal.
          *te bure ae kamamate, ae rawawata*: mortal sin, grievous sin.
          *te bure ae bebete; ae bakekete*:
          *venial sin*.
          *(bureu, burem, burena) au bure, am bure, ana bure*.
      - label: a.
        text: '*bure, burebure*: culpable, wrong, defective, faulty, criminal, etc.'
      - label: v.
        text: '*bure, bubure, burebure*: to commit a sin, to commit a crime, to do a wrong, etc., to be
          wrong, to make a mistake, to err, to transgress the law, to sin, etc.'
      - label: ex.
        text: |-
          *kaotibure*: confession, telling one's sins.
          *kabara bure*: absolution, to forgive, to beg pardon.
          *tiri bure*: to correct mistakes (in books).
          *taua te bure*: arrest the criminal.
          *ana te bure*: correction, punishment.
          *N na ana am bure*: I will punish you.
          *bubure*: falling often into sin or making many mistakes.
      - label: vt.
        text: '*burena*: to take the responsibility of..., to assume the culpability of..., to take upon
          oneself a fault.'
      - label: ex.
        text: '*N na burena am bure*: I will take your fault on me.'
      - label: vc.
        text: '*kaburea, kabureburea*: to charge, to incriminate, to condemn, to convict, to punish, to
          judge guilty, faulty, to alienate, to sacrifice, to abandon, to give away.'
      - label: ex.
        text: |-
          *e kaburea abana nakoiu*: he willed his land to me.
          *e kaburea maiuna*: he committed suicide.
  - source: goo-banner
    forms:
    - form: bure
      parts:
      - label: sn.
        text: _Amphiperas ovum (i)_.
      - label: n.
        text: egg cowry (ja).
      - label: note.
        text: not found on Onotoa; imported from Abemama for ornaments (i).
