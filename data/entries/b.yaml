  - source: sabatier
    forms:
    - form: boteto
      parts:
      - label: n.
        text: potato (ENG).
      - label: also.
        text: '*buteta*.'
- id: boti
  headword: boti
  trussel: boti
  sources:
  - source: bingham
    forms:
    - form: bóti
      parts:
      - label: n.
        text: a boat (ENG).
    - form: bòti
      parts:
      - label: n.
        text: a place assigned to an individual or claimed by him.
  - source: sabatier
    forms:
    - form: boti
      parts:
      - label: n.
        text: boat (ENG).
    - form: boti
      homograph: 1
      parts:
      - label: n.
        text: a place reserved in *maneaba* for members of certain clan or family or for important people.
      - label: ex.
        text: |-
          *ewe-boti*: to change *boti*.
          *kare boti*: to take another's.
      - label: vt.
        text: '*boti; botina*: to have or appropriate a *boti*, to occupy a certain...'
      - label: idiom.
        text: '*teke boti, e teke botina*: the clan know..., have heard.'
      - label: ex.
        text: '*katekea te boti*: to tease, to defy another *boti*.'
- id: botika
  headword: botika
  trussel: botika
  sources:
  - source: bingham
    forms:
    - form: bótika
      parts:
      - label: va.
        text: conducting in a flirting manner so as to attract the attention of the opposite sex.
      - label: n.
        text: conduct intended to attract the opposite sex.
  - source: sabatier
    forms:
    - form: botika
      parts:
      - label: n.
        text: coquetry, affectation, elegance, dandyism.
      - label: v.
        text: '*botika, bobotika, botikatika*: to show off, to strut, to play the flirt, to act the dandy,
          to have an affected air.'
      - label: vc.
        text: '*kabotika*: to urge to... to treat as...'
      - label: ex.
        text: 'n, v.t. *kana ni botika*: You are showing off to attract my attentionttention.'
- id: botikatika
  headword: botikatika
  trussel: botikatika
  sources:
  - source: bingham
    forms:
    - form: botikátika
      parts:
      - label: va.
        text: habitually putting on airs, accustomed to flirt.
- id: boto
  headword: boto
  trussel: boto
  sources:
  - source: bingham
    forms:
    - form: bóto
      parts:
      - label: n.
        text: a base, a stump, a bulbous root.
      - label: a.
        text: having a bulb, true, certain, not false.
  - source: sabatier
    forms:
    - form: boto
      parts:
      - label: n.
        text: tree trunk, stock, base, foundation, principle.
      - label: a.
        text: '*boto, boboto*: having a trunk (tree), a foundation, a base, a principle, founded on, based
          on.'
      - label: vt.
        text: '*kabotoa*: to wait till trunk of taro is formed, to base or establish one''s ideas.'
      - label: ex.
        text: '*kabotoa nako*: well-established principles, to lay a good foundation.'
      - label: ex.
        text: '*kau boto, kau bati*: big buttocks.'
      - label: syn.
        text: '*kau buki*, *kaubotobota*, *kakanoa mai nano*.'
- id: boto-n-aiai
