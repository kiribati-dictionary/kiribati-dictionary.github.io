      - label: n.
        text: the thigh, the thick fleshy portion of the leg between the knee and the trunk.
- id: botonranga
  headword: botonranga
  trussel: botonranga
  sources:
  - source: bingham
    forms:
    - form: bótonranga
      parts:
      - label: n.
        text: the thigh.
- id: botu
  headword: botu
  trussel: botu
  sources:
  - source: bingham
    forms:
    - form: bótu
      parts:
      - label: va.
        text: weary of doing, tired of doing.
      - label: n.
        text: weariness, fatigue.
  - source: sabatier
    forms:
    - form: botu
      parts:
      - label: n.
        text: ennui, weariness, tedium, boredom, tiresomeness, spleen,.
      - label: v.
        text: to be bored.
      - label: a.
        text: '*kabotu*: tedious, dull,.'
      - label: vc.
        text: '*kabotua*: to bore, to weary, to annoy, to vex, to tire.'
- id: botua
  headword: botua
  trussel: botua
  sources:
  - source: bingham
    forms:
    - form: bòtua
      parts:
      - label: vi.
        text: to glance off as a weapon.
  - source: sabatier
    forms:
    - form: botua
      parts:
      - label: from.
        text: '[[boti]].'
      - label: vt.
        text: '*botuaia* to arrange, to put in place, to set in order.'
    - form: botua
      homograph: 1
      parts:
      - label: v.
        text: '*botua nako*. to slide over, to rebound on... to pass beside, to hit in deviating.'
      - label: vt.
        text: '*kabotua*: to make...'
- id: botuakina
  headword: botuakina
  trussel: botuakina
  sources:
  - source: bingham
    forms:
    - form: botúakina
      parts:
      - label: vt.
        text: to weary of.
  - source: sabatier
    forms:
    - form: botuakina
      parts:
      - label: from.
        text: '[[botu]]:'
      - label: vt.
        text: to do, to support or put up with in spite of weariness or boredom, to persevere in or endure
          in spite of tedium.
      - label: ex.
        text: '*n aki botuakina*: without being weary... bored of...'
- id: botumaka
  headword: botumaka
  trussel: botumaka
  sources:
  - source: bingham
    forms:
    - form: botum'aáka
      parts:
      - label: va.
        text: persevering.
      - label: n.
        text: perseverance.
  - source: sabatier
    forms:
    - form: botumaka
      parts:
      - label: n.
        text: tenacity, perseverance, constancy, obstinacy.
      - label: v.
        text: to persist, to persevere, to be intent on, to set one's heart upon.
      - label: a.
        text: tenacious, constant, obstinate, etc.
      - label: vt.
        text: '*botumaka*: to do with perseverance.'
      - label: vc.
        text: '*kabotumaka, kakabotumaka*: to urge to be... to praise... to make obstinate.'
      - label: ex.
        text: '*kabotumakaingkami!*: keep on! persevere! keep on keeping on!'
- id: botumara
  headword: botumara
  trussel: botumara
  sources:
