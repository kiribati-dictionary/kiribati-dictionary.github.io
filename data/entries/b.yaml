      parts:
      - label: n.
        text: a blow, stroke.
      - label: v.
        text: to hit, to thump, to knock, to touch, to hurt, to get hit.
      - label: ex.
        text: |-
          *e bo ubuna*: he got hit in the face.
          *e bo te ika*: the fish is tainted, bad, deteriorated.
      - label: vt.
        text: |-
          *boa, boboa*: to hit, to hurt, to beat.
          *boboa*: to tap on, to beat with repeated blows.
      - label: ex.
        text: |-
          *bo-maneka*: cutting steps on coconut tree for climbing.
          *bo-niba*: cut notches, holes.
      - label: see
        text: idiom. *e bo ketena*, *e bo makina*.
      - label: ex.
        text: |-
          *au bo, am bo, ana bo*: etc. blows which I, you, he, etc., gives.
          *bou, bom, bona*: the blows which I, you, he, receive.
    - form: bo
      homograph: 2
      parts:
      - label: n.
        text: contact, meeting, fight, combat.
      - label: ex.
        text: '*te bo ni buaka*: a battle, a war.'
      - label: v.
        text: '*bo, bobo, bo ma*: to be in contact, to touch, to meet, to fight with or against.'
      - label: ex.
        text: '*e bo atin te maie*: the merry making is in full swing.'
      - label: vt.
        text: '*kaboa, kaboboa*: to put in contact, to make touch, to unite.'
    - form: bo
      homograph: 3
      parts:
      - label: n.
        text: equality, equivalence, accord, agreement.
      - label: ex.
        text: |-
          *te bo n nano*: mutual agreement.
          *ti te bo te aro*: all religions are the same.
      - label: a.
        text: equal, like, similar, same, matched, paired.
      - label: see
        text: '[[bobuaka]], [[boraoi]].'
      - label: vc.
        text: '*katiteboa*: to make equal, to equalize, to make the same.'
    - form: bo
      homograph: 4
      parts:
      - label: v.
        text: to go towards... to come, to arrive.
      - label: v.
        text: '*e bo nakoiang, e bo nakoaiaki, e bo rio, e borake*:... goes towards the north, south,
          west, east.'
      - label: ex.
        text: |-
          *e bo nako*: he is gone.
          *bo mai*: come here.
          *ko bo maiia?*: where do you come from? where have you been?
          *e bo am tai*: it is your time (your turn).
    - form: bo
      homograph: 5
      parts:
      - label: n.
        text: price, value, cost, wage, compensation, reward, answer.
      - label: ex.
        text: |-
