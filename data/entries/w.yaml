- id: w
  headword: w
  trussel: w
  sources:
  - source: sabatier
    forms:
    - form: w
      parts:
      - label: note.
        text: 'The Gilbertese *w* differs from the English *w*. It more like the sound of *v* especially
          if followed by *e*:'
      - label: ex.
        text: '*kewe, keve, wete, vete, vene, wene*...'
- id: wa
  headword: wa
  trussel: wa
  sources:
  - source: bingham
    forms:
    - form: wa
      parts:
      - label: n.
        text: a canoe.
      - label: n.
        text: sleepers of a floor.
    - form: wa
      parts:
      - label: vi.
        text: to move along in a company as persons or fish.
  - source: sabatier
    forms:
    - form: wa
      parts:
      - label: n.
        text: '*te wa, to wa* (N) any vehicle, any means of conveyance: canoe, boat, bicycle, cart, toy...,
          pawn in chess,... checkers.'
      - label: ex.
        text: |-
          *wam te baitika*: your bicycle.
          *te wa ni kiba*: aeroplane <airplane>.
      - label: fig.
        text: '*e maninga wau*: my head forgets.'
      - label: see
        text: v.t. [[wana]].
    - form: wa
      homograph: 1
      parts:
      - label: pref.
        text: of [[waki]] in compound words.
      - label: see
        text: '[[wa-buaka|wa-puaka]], [[wa-ni-kangare]], *wanraea*.'
      - label: note.
        text: 'in the sense of, to be doing. corresponds to *manibuaka, manraoi, manikangare, manrea*:
          to be in a state of... (slight nuance).'
    - form: wa
      homograph: 2
      parts:
      - label: suf.
        text: '[[wawa]] to go,... move.'
      - label: see
        text: '*au wa*, [[awawa|a wawa]].'
    - form: wa
      homograph: 3
      parts:
      - label: n.
        text: beam, joist.
      - label: ex.
        text: |-
          *te wa n nano*: lower beam, floor beam.
          *te wa n anti*: scaffolding, horse or trestle.
    - form: wa
      homograph: 4
      parts:
      - label: n.
        text: species, kind (fish, birds), category of...
    - form: wa
      parts:
      - label: n.
        text: '*te wa n Tarawa*: a dance, manner of procedure, ceremonial <ceremony> for different rites,
          composition or performance following a method.'
    - form: wa
      homograph: 6
      parts:
      - label: nv.
        text: '*wawa, wanako*: to go,... move,... displace oneself, to flow,... flow away.'
      - label: ex.
        text: |-
          *a wa nako ika*: the fish are going off, travelling.
          *a wawa ranni matana*: his tears are flowing.
      - label: vc.
        text: '*kawaea, kawawaea*: to make flow.'
      - label: n.
        text: '*te bai ni kawawa*: guttering, spouting.'
      - label: ex.
        text: '*ikawawa*: to wander around in mobs, gangs, etc., vagrancy of number of persons together.'
    - form: wa
      homograph: 7
      parts:
      - label: n.
        text: '*te Wa*: a constellation.'
    - form: wa
      homograph: 8
      parts:
      - label: pref.
        text: or suf. of [[wawa]], [[waki]], *waanga*.
