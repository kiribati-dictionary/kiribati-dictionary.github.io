- id: i
  headword: i
  trussel: i
  sources:
  - source: bingham
    forms:
    - form: i
      parts:
      - label: suf.
        text: I, me.
      - label: note.
        text: In the objective it is preceded by *a* which unites it to the root of that transitive verb.
      - label: suf.
        text: them, neuter, to root of transitive verb.
      - label: note.
        text: always followed by a predicate.
      - label: pre.
        text: at, in, by, with.
      - label: n.
        text: native of a place ( prefix used with a hyphen).
      - label: adv.
        text: one another (reciprocal).
      - label: intj.
        text: exclamation of dislike or disgust.
    - form: i
      parts:
      - label: vi.
        text: sink.
  - source: sabatier
    forms:
    - form: I
      parts:
      - label: pron.
        text: 1st per. sing. (must be written with capital letter).
      - label: ex.
        text: '*I tiku*: I stay.'
      - label: note.
        text: before *na* sign of future it is replaced by *N*.
    - form: I
      homograph: 1
      parts:
      - label: pref.
        text: to names of places or categories.
      - label: note.
        text: It designates persons originating or living in those places or members of these categories.
          Always a capital letter in this case and separate from the word.
      - label: ex.
        text: |-
          *te I-Buranti*: a Frenchman.
          *te I-batabata*: a Negro.
      - label: adv.
        text: indicating reciprocation, reciprocally.
      - label: ex.
        text: |-
          *te i tangitangiri*: mutual love.
          *te i buobuoki*: mutual help.
          *ti i buobuoki*: we help one another.
      - label: prep.
        text: in, at, with, by (not followed by article.
      - label: ex.
        text: |-
          *i taberan te ni*: at the top of the tree.
          *i an*: under.
          *i nano*: below.
          *i main*: before.
          *i etan*: above.
    - form: i
      parts:
      - label: intj.
        text: excl. of displeasure, pain, fear, disgust.
      - label: note.
        text: (either long *ii* or short *i*.).
    - form: i
      homograph: 1
      parts:
      - label: n.
        text: '*te i* or *te ti*: tea.'
    - form: i
      homograph: 2
      parts:
      - label: n.
        text: a kind of onomatopoeia showing the prolongation, continuity, intensity*(i...i...i...)*.
      - label: see
        text: '[[ia]], [[iakiaki]].'
      - label: ex.
        text: '*e ia, e iaki te karau*: it is raining heavily.'
    - form: i
      homograph: 3
      parts:
      - label: v.
        text: to diminish, to fade away, to disappear.
      - label: ex.
        text: '*i nako*: to sink in, to go down.'
      - label: vc.
        text: |-
          *ka-ia*: to make...
          *ka-inakoa*: to make sink, disappear.
      - label: ex.
        text: '*e a i te tibu*: the swelling has gone down.'
    - form: i
      homograph: 4
      parts:
      - label: vt.
        text: to pulverize, to grind, to grate finely.
      - label: ex.
        text: '*te bai n i*: the mill, the grater, the grinder.'
- id: i-main-nanoa
  headword: i main nanoa
