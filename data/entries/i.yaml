- id: ia
  headword: ia
  trussel: ia
  sources:
  - source: bingham
    forms:
    - form: i:/a
      parts:
      - label: adv.
        text: where? (interrogative).
      - label: vt.
        text: grate, grind.
    - form: ía
      parts:
      - label: n.
        text: |-
          gray hair.
          vein.
      - label: n.
        text: state of tide.
      - label: pron.
        text: them, often a suffix pronoun and often connected to verbal root by *i*, indicated by *i'*
          their a suffix pronoun.
  - source: sabatier
    forms:
    - form: ia
      parts:
      - label: from.
        text: '[[i]].'
      - label: vt.
        text: to grind, to grate, to pulverize.
      - label: v.
        text: falling abundantly as in the following.
      - label: ex.
        text: '*e ia te karau*: it is raining and raining.'
    - form: ia
      homograph: 1
      parts:
      - label: adv.
        text: where (interrog.).
      - label: ex.
        text: |-
          *ko maeka ia?*: where do you live?
          *ia abam?*: what country do you belong to? what nationality are you?
          *ko nako ia?*: where are you going?
          *ko nako mai ia?*: where do you come from?
    - form: ia
      homograph: 2
      parts:
      - label: n.
        text: a vein, an artery.
      - label: ex.
        text: |-
          *ian te rara*.
          *e bure te ia*: the vein is distorted (varicose) cramped, spasm>.
    - form: ia
      homograph: 3
      parts:
      - label: n.
        text: nerve, muscle, tendon.
      - label: ex.
        text: |-
          *e tiki te ia*: the nerve is strained.
          *e bure te ia*: a cramp <spasm>.
          *ian te korakora*: the nerve of strength.
          *iaia*: to have cramps.
          *taka iaia*: to shiver, to tremble, teeth chattering.
      - label: vc.
        text: '*ka iaia*: make, cause...'
      - label: ex.
        text: '*ka iaia mangaina*: to move the jaws.'
    - form: ia
      homograph: 4
      parts:
      - label: n.
        text: grey or greying hair.
      - label: ex.
        text: |-
          *e a teke te ia*: the hair is beginning to go grey.
          *e a koro te ia, e takaiaia te atu*: altogether white.
          *iaia*.
      - label: vc.
        text: '*ka-iaia*: to make or let grow gre.'
    - form: ia
      homograph: 5
      parts:
      - label: adj.
        text: poss. suff. of 3rd per. plur. their.
      - label: ex.
        text: |-
          *atuaia*: their God.
          *atuia*: their head.
          *taekaia*: their reputation.
      - label: note.
        text: see compound words below --.
    - form: ia
      parts:
      - label: n.
        text: tide, flow, flux, ebb.
      - label: ex.
        text: |-
          *te moan ia*: beginning of spring tides.
          *te o n ia*: spring tides at highest point.
          *te iara*: neap tides.
          *te kabi n iara*: neap tides at lowest ebb-tide.
          *te ia kamate*: half tide (between neap and spring).
          *te ia n ora*: lowest point at time of spring tide.
      - label: syn.
        text: '*oratangetange*, *te toki n ia*: last of spring tides ([[taitoki]]).'
      - label: vc.
        text: |-
          *ka-iarakea*: wait for the tide, the ebb.
          *ka-ia n ora*: wait for...
    - form: ia
      homograph: 7
      parts:
      - label: suf.
        text: to tr. verbs followed by animated plural object.
      - label: ex.
        text: |-
          *ko na batiboia*: you must beat them.
          *N na tuangia*: I will tell them.
          *a angania te batoro*: they gave them the bottle.
