          2nd <second> day: *e buti n ika*.
          3rd <third> day: *e oti, e koran*.
      - label: ex.
        text: '4th <fourth> day: *e aomata*.'
      - label: ex.
        text: |-
          7th <seventh> day: *e itibong*.
          8th <eighth> day: *e kare ao e bongina*.
          9th <ninth> day: *e kare ao uabong*.
          10th <tenth> day: *e kare ao tenibong*.
          12th <twelvth> day: *e renaba*.
          13th <thirteenth> day: *e toka, e eremao*.
          14th <fourteenth> day: *e toka n rin, e tabanin*.
          15th <fifteenth> day: *e tanimainiku*.
          16th <sixteenth> day: *e rin tebongina... uabong*.
          17th <seventeenth> day: *e rin tenibong*.
          21st <twenty first> day: *e kaitibong i an tari*.
          25th <twenty fifth> day: *e unabong, e kaiti*.
          26th <twenty sixth> day: *e unabong naba, e kaiti*.
          27th <twenty seventh> day: *mata-oiaki*.
          28th <twenty eighth> day: *e neve roro*.
          29th <twenty ninth> day: *e anti*.
