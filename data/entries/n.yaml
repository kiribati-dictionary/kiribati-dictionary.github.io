- id: n
  headword: n
  trussel: n
  sources:
  - source: bingham
    forms:
    - form: n
      parts:
      - label: pron.
        text: |-
          his, her, its, always written as a suffix, much resembling of.
          I (never alone but always with verb, or predicate).
      - label: prep.
        text: in, at, to, by, with, of *n*.
      - label: note.
        text: becomes *ni* before *m, b, k*, and the word *ne*.
  - source: sabatier
    forms:
    - form: N
      parts:
      - label: pron.
        text: (capital) replaces *I* before *na*, *nang*, the future tense.
      - label: ex.
        text: '*N na kawariko*: I will call on you.'
    - form: n
      parts:
      - label: pref.
        text: to certain words to indicate the nature, natural custom.
      - label: ex.
        text: '*ntorotoro*, from *torotoro*, etc.'
    - form: n
      homograph: 1
      parts:
      - label: and
        text: '[[ni]].'
      - label: prep.
        text: of, in, at, by, for, with, as.
      - label: ex.
        text: |-
          *e aki toki ni karongoa*: he doesn't stop (in) making noise.
          *e roko ni kawarai*: he came to see me.
          *e mena n au auti*: he is in my house.
          *ni makana*: by his power.
    - form: n
      homograph: 2
      parts:
      - label: prep.
        text: is used before vowels and *n, r, t* it becomes *ni* euph. before *b, k, m, ng, p, w*. Before
          *w* it becomes *nu* in many islands.
      - label: ex.
        text: '*tabonuwai* for *taponiwai*.'
      - label: note.
        text: in Butaritari and Makin *n* is put between the negative and the verb.
      - label: ex.
        text: '*I aki n ataia*: I don''t know.'
    - form: n
      homograph: 3
      parts:
      - label: and
        text: |-
          [[ni]].
          [[na]].
      - label: suf.
        text: poss. adj. for his, her, its (n. euph.).
      - label: ex.
        text: |-
          *baran te tei*: the child's hat.
          *barani Betero*: Peter's hat.
      - label: and
        text: '[[na]] for [[ana]].'
      - label: ex.
        text: '*barana*: his hat.'
- id: na
  headword: na
  trussel: na
  sources:
  - source: bingham
    forms:
    - form: na
      parts:
      - label: n.
        text: loose rocks or stones on a flat.
      - label: aux.
        text: sign of the future or imperative.
      - label: pron.
        text: suffix euphonic particle.
      - label: ex.
        text: '*bongina, terana?, tebwina*.'
      - label: pron.
        text: possessive suffix, his, her, its.
      - label: vt.
        text: spit out.
  - source: sabatier
    forms:
    - form: na
      parts:
      - label: suf.
        text: (1) for one (*teuana*).
      - label: ex.
        text: |-
          *te barana*: one basket.
          *terana?* for *tera teuana*: one what?
      - label: part.
        text: (2) aux. sign of future tense.
      - label: ex.
        text: '*a na nako*: they will go. <shall>.'
    - form: na
      homograph: 1
      parts:
      - label: and
        text: |-
          [[nang]].
          *nan te*.
      - label: art.
        text: the. before certain proper nouns (masculine), names of species, qualifications. a kind of
          title used in Makin and Butaritari corresponding to *Te* in other islands.
      - label: ex.
        text: |-
          *Na Kaiea*: Mr. Kaiea.
          *Na Kauki*: crab.
          *Na Katama*: cat.
      - label: note.
        text: '*Na* is used before *ka* and *ke*, and *nang* before *ki, ko, ku*.'
