          nakoia*: towards me, etc.'
      - label: ex.
        text: |-
          *nako karawa*: towards heaven; *nako eta*: upwards.
          *nako mone*: (without article) downwards, the depths.
          *nakon te kawa*: towards the village.
      - label: ex.
        text: '*e rietata nakoni kai*: it is higher than trees.'
      - label: ex.
        text: '*e un nakoiu*: he is cross (to) with me.'
    - form: nako
      homograph: 1
      parts:
      - label: a.
        text: each, every, all.
      - label: ex.
        text: |-
          *te bong nako*: each day.
          *bongi nako*: every day.
    - form: nako
      homograph: 2
      parts:
      - label: v.
        text: to go, to depart, to go on, to go away.
      - label: red.
        text: '*nanako*: to go often.'
      - label: ex.
        text: '*E nako Tarawa*: He went to Tarawa.'
      - label: ex.
        text: '*Tai nako!*: Don''t go!'
      - label: ex.
        text: '*Nako!*: Go away, Be off...'
      - label: n.
        text: the act of going, leaving, walking, departing, moving.
      - label: see
        text: '[[nakonako]].'
      - label: ex.
        text: |-
          *I uringa nakom*: I remember your departure.
          *Akea nakona*: It won't go again.
      - label: nv.
        text: '*nakoiang, nakoaiaki, nakomainiku, nako maeao*: to go to the north, to the south,... east,...
          west.'
      - label: ex.
        text: |-
          *nakomai, nanakomai*: to come, to approach.
          *nakoati, nakowati*: to go towards the one who calls.
      - label: a.
        text: '*kai nako, kakai nako*: quickly gone, easily taken off, easy to take off.'
      - label: vc.
        text: '*kanakoa*: to make go, to send, to cause to depart, to send away, to expel, to banish,
          to dismiss, to discharge, to let go, to let escape.'
      - label: red.
        text: '*kananakoa*: to make go often, regularly, to loosen little by little.'
      - label: v.
        text: '*kanakoianga*: to send towards the north.'
      - label: ex.
        text: |-
          *kanakomaia*: to make approach..., come towards.
          *kanakowatia*: to make go towards *kanakomaiaka*: to make go or come south.
          *kanakomeanga*: to make come north*kanakomaeaoa, kanakomainikua*.
