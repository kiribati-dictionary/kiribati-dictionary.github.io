- id: oi
  headword: oi
  trussel: oi
  sources:
  - source: bingham
    forms:
    - form: ói
      parts:
      - label: n.
        text: |-
          the very thing itself, the very person himself, one's self.
          torch.
      - label: vi.
        text: perform an incantation before fishing on the flats.
      - label: vi.
        text: be of no account.
      - label: intj.
        text: response to words of praise.
  - source: sabatier
    forms:
    - form: oi
      parts:
      - label: n.
        text: (the real thing).
      - label: a.
        text: genuine, substantial, proper.
      - label: n.
        text: substance, essence, base, body.
      - label: ex.
        text: |-
          *oi ni bai*: a valuable thing.
          *oi n te bai*: the essence of the thing.
          *bon oin nanom?* is it really your own will?
          *i oin te ni*: at the base of the tree. <trunk (of a tree)>.
    - form: oi
      homograph: 1
      parts:
      - label: int.
        text: (1) ironical of pleasure after praise.
      - label: ex.
        text: '*oi! oi! oi!*'
      - label: n.
        text: (2) a torch of dried palm leaves used for night fishing.
      - label: ex.
        text: '*te oi ni kibe,... n tatae*.'
      - label: n.
        text: |-
          an incantation for this kind of fishing.
          *nan te oi* (N.) fire spirit.
      - label: syn.
        text: Nei Bainae, Batuare (S.).
    - form: oi
      homograph: 2
      parts:
      - label: int.
        text: '*ti oi! ti oingkoe! ti oi ngkami!*'
      - label: also.
        text: '*kioi!*.'
      - label: ex.
        text: '*tioinaki! oinaki am bai*: be blowed! bother! confound it! hang it!'
