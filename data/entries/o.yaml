- id: o
  headword: o
  trussel: o
  sources:
  - source: bingham
    forms:
    - form: o
      parts:
      - label: vi.
        text: stretch.
      - label: vi.
        text: paddle.
      - label: vi.
        text: fly as an arrow, whiz.
      - label: n.
        text: fence.
      - label: n.
        text: gill of a fish.
      - label: n.
        text: certain disease.
      - label: intj.
        text: used in response to a call.
  - source: sabatier
    forms:
    - form: o
      parts:
      - label: intj.
        text: call, reply, surprise, lassitude, etc. (diff. tone but always placed at the end).
      - label: ex.
        text: '*Maria O! Karaki O! I a mate O! Ai kabotura O!*'
    - form: o
      homograph: 1
      parts:
      - label: n.
        text: gill of fish.
      - label: ex.
        text: '*marai n o*: white of gills.'
      - label: ex.
        text: '*oni bua, buro ni bua*: tonsils.'
    - form: o
      homograph: 2
      parts:
      - label: n.
        text: enclosure, cloister, fence, enclosed property, stable, cage.
      - label: ex.
        text: |-
          *te o n aoraki*: hospital.
          *te o ni beki*: pigsty.
          *te o ni kitiba*: cage for *kitiba, ou, om, ona*, etc.
      - label: vt.
        text: '*oa*: to enclose, to shut in, to partition off, to put in cage, stable, etc....'
      - label: v.
        text: fig. to catch, to be caught in the very act, to catch up with, to be found out.
      - label: ex.
        text: '*a oia boreitiman*: the police caught him.'
    - form: o
      homograph: 3
      parts:
      - label: v.
        text: to make one or more muscular efforts, to strain muscles for effort.
      - label: a.
        text: strong, vigorous, having nerve.
      - label: ex.
        text: |-
          *omaka*: making strong effort.
          *e o birina*: he has great rapidity in running.
          *e bai o*: he has a strong arm.
          *e oo*: it stiffens, makes efforts: (baby in bed).
          *o rake*: make efforts to go east (paddle towards...).
          *o rio*: make efforts to go west.
          *o mai*: to approach, to come.
          *o nako*: to move away.
      - label: vt.
        text: |-
          to make effort to...
          *orakea, orakea te wa*: to paddle the canoe towards the land, to make advance by paddle or oar.
