  - source: sabatier
    forms:
    - form: oki
      parts:
      - label: n.
        text: return.
      - label: v.
        text: to return, go back, to come back.
      - label: ex.
        text: |-
          *oki-rikaki*: to come backwards.
          *okioki*: to come often.
          *oku, okin, okina*, etc.
          *rai okioki, raraiokioki*: to go backwards and forwards,... to and fro.
          *okikaua*: to come back twice.
          *oki-ten*: to come back three times.
          *I nako n oki*: I go away to come back again soon.
          *ai oku!* at my return.
      - label: vc.
        text: '*ka-oki*: to make come back, to make return, to send back, to give back, to restitute,
          to put back in place.'
      - label: v.
        text: '*ka-okioki, kakaokioki*: to keep bringing back, to keep repeating, dinning.'
      - label: vc.
        text: '*ka-okioka: kakaokioka*. _idem_.'
