      - label: ex.
        text: '*e tabababa n taetae*: speaking much about many topics.'
      - label: vc.
        text: '*katababaea, kakata*...: to make..., to ruffle, to bristle, to frizz, to frizzle, etc.'
      - label: sup.
        text: 'superlative of [[taba]]: going in all directions <diverging (diverge)?>.'
