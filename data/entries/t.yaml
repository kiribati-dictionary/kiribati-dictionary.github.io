        text: to pare, to whittle, to scrape.
  - source: sabatier
    forms:
    - form: taba
      parts:
      - label: n.
        text: strongly perfumed white leaves of pandanus.
      - label: v.
        text: to flower.
      - label: a.
        text: in flower.
      - label: vc.
        text: '*katabaea*: let..., wait till...'
      - label: ex.
        text: '*moantabaea*: _idem_.'
    - form: taba
      homograph: 1
      parts:
      - label: n.
        text: oil perfumed with pandanus leaves.
    - form: taba
      homograph: 2
      parts:
      - label: n.
        text: a young girl.
      - label: see
        text: '[[otaba]].'
    - form: taba
      homograph: 3
      parts:
      - label: n.
        text: cheek.
      - label: ex.
        text: |-
          *oro taba*: to slap on cheek.
          *kabo taba*: to embrace.
      - label: see
        text: '[[kauntaba|kaun taba]].'
    - form: taba
      homograph: 4
      parts:
      - label: n.
        text: |-
          *taban te rawa*: sides, edges of passage.
          *te taba ni kawai*: digression of route.
      - label: v.
        text: |-
          *taba*: to deviate, to go sideways.
          *tabataba, tabataba nako*: to go in all directions, to zigzag, not following the straight path,... the right direction, the middle course.
      - label: ex.
        text: |-
          *e tabataba n taetae*: cock and bull story, disconnected speech (*e rawerawe nako n taetae*).
          *e tabataba kawaina*: (canoe) unable to sail straight, but veering off course.
      - label: vc.
        text: '*ka taba*: to make deviate, go sideways, digress, go off course.'
      - label: ex.
        text: '*e kataba kaina*: he avoids a blow by moving (stepping) sideways.'
    - form: taba
      homograph: 5
      parts:
      - label: n.
        text: cutlass, jungle knife, sword, machete.
      - label: syn.
        text: '[[naibi]].'
      - label: vt.
        text: '*tabana*: to possess, to take possession, to use a large knife, to split or cut with...'
    - form: taba
      homograph: 6
      parts:
      - label: vt.
        text: '*taba, ta bia, tabaki*: to cut, to split, to sharpen point.'
      - label: syn.
        text: '[[korotaba]], *korotabia* (to sharpen pencil) [[taima]].'
    - form: taba
      homograph: 7
      parts:
      - label: note.
        text: special sound of *p* with very brief final *a*.
      - label: n.
        text: choking.
      - label: v.
        text: to choke in swallowing.
      - label: vt.
        text: (irr.) to cause suffocation, choking in swallowing <suffocate>.
