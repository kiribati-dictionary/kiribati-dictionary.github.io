        text: fugitive, transient, unreal, invisible, not developed.
      - label: ex.
        text: |-
          *e anti namakaina*: the moon does not appear (is invisible).
          *e anti te bunnimoa*: the egg is fresh.
          *e aomata te bunnimoa*: the egg is fertile.
          *e aomata namakaina*: the moon is again visible.
      - label: a.
        text: wild, savage (hard to see or take, takes flight at the approach of humans, timid, unsociable).
      - label: ex.
        text: |-
          *te moa anti*: a wild fowl.
          *e moa anti*: he is not tame, he is timid.
          *te katama anti*: a wild cat or wild beast.
          *e katama anti*: it is savage.
          *te kamea anti*: a wild dog, wolf or ferocious animal.
