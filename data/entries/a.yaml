          all things.'
      - label: also.
        text: 'called *Na Areau te Iti*: the Great Spirit.'
      - label: ex.
        text: '*Na Areau te tei*: the Young.'
      - label: also.
        text: 'called *Te ti*: the Small, the deformed:.'
      - label: ex.
        text: '*Na Areau te Kikiteia*: the Seeker.'
    - form: areau
      homograph: 1
      parts:
      - label: n.
        text: '*te nareau*: a spider, a cobweb.'
      - label: ex.
        text: |-
          *te bareau*: big reddish spider.
          *Ten Takareau*: spider's web.
      - label: a.
        text: '*ae bareau*: covered with cobwebs.'
      - label: fig.
        text: veiled, not clear, for ex. the eyes.
      - label: ex.
        text: |-
          *bon te bareau tabonibain teuaei*: he works expertly as a spider making a web.
          *maneaba n nareau*: spider's web.
    - form: areau
      homograph: 2
      parts:
      - label: fig.
        text: quick and well done.
      - label: ex.
        text: '*e naia n te areau*: no sooner said than done.'
