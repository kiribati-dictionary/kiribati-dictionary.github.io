    forms:
    - form: árarake
      parts:
      - label: vt.
        text: go up, ascend, climb up as on a mountain.
  - source: sabatier
    forms:
    - form: ararake
      parts:
      - label: v.
        text: 1. to go up a slope or straight line (trees, mountains).
      - label: n.
        text: ascent, ascension.
      - label: syn.
        text: '[[tamarake]].'
      - label: ex.
        text: '*te kai n ararake, te kai n tamarake*: ladder, stairs.'
      - label: vc.
        text: '*ka ararake*: to make ascend.'
      - label: v.
        text: 2. to go towards the land (canoe). To do this one has to sail close to the wind, to haul
          to windward.
      - label: vt.
        text: '*ararakea*: to go up a steep slope, stairs, a tree, a mountain or ladder.'
      - label: vc.
        text: '*ka ararakea*: 1. to make ascend.2. to steer a canoe towards land or to windward.'
      - label: see
        text: '[[tamarake]], [[rierake]], [[waerake]].'
