- id: a
  headword: a
  trussel: a
  sources:
  - source: bingham
    forms:
    - form: a
      parts:
      - label: suf.
        text: him, her, it, a suffix pronoun following an active transitive verb, usually united to the
          root by *i*.
      - label: pron.
        text: they, when in the nominative case. in this case it is always followed by the predicate.
      - label: aux.
        text: |-
          a sign of the perfect tense, or of action just completed, often used to express a future immediate action.
          affirmative particle much like am, are, is, etc.
      - label: n.
        text: |-
          under side.
          core base of the pan bunch.
      - label: n.
        text: stick used in netweaving for measuring the meshes.
      - label: n.
        text: marine animal with thorns.
      - label: n.
        text: dandruff.
      - label: vi.
        text: gape.
      - label: a.
        text: four, always followed by a numeral suffix, *ai, ua, ung, man, na, kai, kora,*or by a certain
          noun as *bong, ririki, ritoro, inaki, atao, ba,*or by certain adjectives as *bwi, bubua,*etc,.
  - source: sabatier
    forms:
    - form: a
      parts:
      - label: suf.
        text: it (p.p. object suffix of the 3rd pers. joined to v.t.). It is joined to the root word either
          directly or by the intermediary of an *i* or an *e* or by redoubling of the preceding consonant
          or redoubling itself.
      - label: ex.
        text: |-
          *katekea*: pierce it.
          *ko noria*: you see it.
          *I kamamaea*: I made him ashamed.
          *a tiringnga*: they killed it.
          *e kabaka*: he let it fall.
          *a kanna*: they ate it, etc.
    - form: a
      homograph: 1
      parts:
      - label: suf.
        text: part. sign of v.t. when these have an object in the sing.
      - label: ex.
        text: |-
          *I nora te kaibuke*: I see the ship.
          *e urakina te kai*: he carries the stick.
    - form: a
      homograph: 2
      parts:
      - label: aux.
        text: preceding verbs to show an immediate past or future and sometimes to express the result
          of an action or a state attained.
      - label: ex.
        text: |-
          *e a nako*: he has gone.
          *I a kabaia*: I am happy.
          *e a mananga te aba*: we are about to go <have>.
    - form: a
      homograph: 3
      parts:
      - label: pron.
        text: they.
    - form: a
      homograph: 4
      parts:
      - label: adj.
        text: root of the num. adj. meaning four (4), the suff. being either a kind as for example, *a-ua,
          a-kai*; or a simple noun.
      - label: ex.
        text: '*a-bong, a-ririki, a-ba*.'
      - label: note.
        text: 'or again the num. adj. indicating tens, hundreds, thousands, millions:'
      - label: ex.
        text: '*a-bwi* (40), *a-ngaun, a-bubua,a-nga, a-mirion.*'
    - form: aa
      homograph: 5
      parts:
      - label: n.
        text: a sea urchin with poisonous spikes.
    - form: aa
      homograph: 6
      parts:
      - label: n.
        text: the heart or core of certain fruit.
      - label: ex.
        text: |-
          *aan te mai*: core of breadfruit.
          *aan te tou*: core of pandanus.
    - form: aa
      homograph: 7
      parts:
      - label: n.
        text: a kind of flour, *kabubu*, made from the pandanus fruit and mixed with the core of the fruit
          as well as the pulp.
      - label: see
        text: '[[kabubu]].'
    - form: aa
      homograph: 8
      parts:
      - label: n.
        text: a food prepared from a mixture of the core of pandanus fruit and syrup of toddy. (the core
          is cooked, minced, dried in the sun and ground beforehand.).
    - form: aa
      homograph: 9
      parts:
      - label: n.
        text: a small wooden tool used to shape the mesh in making fishing nets.
    - form: aa
      homograph: 10
      parts:
      - label: n.
        text: dandruff, desquamation. a peeling, scaling off.
    - form: aa
      homograph: 11
      parts:
      - label: n.
        text: yawn.
      - label: v.
        text: to yawn.
      - label: ex.
        text: |-
          *te aa ni kanimatu, te aa ni matu*: a sleepy yawn.
          *e ka-aa-nako*: he is yawning, beginning to yawn, he is not interested.
    - form: aa
      homograph: 12
      parts:
      - label: n.
        text: '*aan te*: the underneath, the bottom, the base, the groundwork, the foundation.'
      - label: ex.
        text: |-
          *an te Ekaretia Petero*: Peter is the foundation of the church.
          *te aa ni kabakoa,... ni kabara*: sea bottom favourable for shark fishing.
          *te aa ro*: dark sea bottom.
          *te aa ota*: clear sea bottom.
      - label: vt.
        text: '*ana*: to put a prop against, to support.'
      - label: n.
        text: '*aanan, aanakin*: the act of supporting, being supported.'
      - label: nv.
        text: 'fig. *antaeka (aan taeka), anibana (aa ni bana)*: to be subject, yield, submit.'
      - label: ex.
        text: '*e riai n antaeka te aine iroun te mane*: woman must be subject to man.'
      - label: n.
        text: |-
          fig. *an te taeka*: hidden meaning of a word.
          fig. *te antari*: distant relatives, distant relative.
      - label: ex.
        text: |-
          *antaru, antarim, antarina,* etc.
          *bu*: near relatives or relative.
          *au bu, am bu, ana bu,* etc..
      - label: pref.
        text: dim. joined to certain words.
      - label: ex.
        text: |-
          *a-karewe*: slightly sweet.
          *a-bue*: slightly warm.
      - label: adv.
        text: '*i an*: beneath, under.'
      - label: ex.
        text: '*e amarake te katama i an te taibora*: the cat eats under the table.'
