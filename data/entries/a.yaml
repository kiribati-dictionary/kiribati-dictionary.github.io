    forms:
    - form: aba
      parts:
      - label: n.
        text: country, land, earth, world, property.
      - label: fig.
        text: people, the crowd, they.
      - label: ex.
        text: |-
          *e mananga te aba*: they are going.
          *te aba n taningo*: a distant country.
      - label: ex.
        text: '*te aba n uea*: a kingdom.'
      - label: ex.
        text: '*te aba n utu*: land inherited or land of a family.'
      - label: ex.
        text: '*te aba n tangira*: land given or received as a gift.'
      - label: ex.
        text: '*te aba n nebonebo*: land given or received in compensation for a murder.'
      - label: ex.
        text: '*te aba n toka*: land captured in war.'
      - label: ex.
        text: '*te aba te bora*: land given or received on account of a certain ancient custom (a woman
          putting a wreath of flowers around the neck of an uncle (distant) of her husband during a public
          assembly).'
      - label: ex.
        text: '*te aba ni kakua*: land given or received in gratitude for assistance.'
      - label: ex.
        text: '*te aba ni batike*: land or place where a person found sanctuary or refuge from an enemy.'
      - label: see
        text: '[[ababa]], [[abana]], etc.'
      - label: ex.
        text: |-
          *abarerei*: flourishing land.
          *te aba ni mumuta*: reward for nursing.
          *te aba n tibu*: for adoption.
    - form: aba
      homograph: 1
      parts:
      - label: a.
        text: four (for counting leaves).
