      parts:
      - label: n.
        text: productivity, abundant harvest, sufficient food.
    - form: areare
      homograph: 1
      parts:
      - label: n.
        text: fig. for productive pers. good provider, worker, fruitful worker.
      - label: ex.
        text: |-
          *ko areare na am bai*: you are doing well, good business.
          *e aki areare te aine aei*: this woman is a mediocre worker.
      - label: vc.
        text: |-
          *ka arearea*: 1. to serve, to give more to.
          2. to esteem as good worker.
      - label: n.
        text: '*taka areare*: in small number of quantity (pers. things), rare.'
    - form: areare
      homograph: 2
      parts:
      - label: n.
        text: '*te areare*,.'
      - label: a.
        text: |-
          *e areare*: sufficient food, in sufficient quantity, enough for each guest.
          *aki areare*: not enough.
      - label: ex.
        text: '*ba areare, ma areare*: in mediocre quantity, insufficient.'
- id: areau
  headword: areau
  trussel: areau
