  - source: sabatier
    forms:
    - form: akaka
      parts:
      - label: n.
        text: care, choice, art of doing well, well done, carefully done, needing care and attention.
      - label: ex.
        text: '*e akaka?*: is it very important?'
      - label: ex.
        text: (used mostly in negative -- *aki akaka*).
      - label: ex.
        text: |-
          *te aki akaka, e aki akaka*: reckless, devil-may-care way of doing things, without taste or art, carelessness, negligence.
          *ko aki akaka*: you are negligent.
          *ti aki akaka*: we have no preference, we don't mind.
          *akaka*: to prefer, to choose.
          *aki akaka*: to treat..., do carelessly, anyhow.
          *aki akakaki*: not done carefully, tastefully.
