- id: aki
  headword: aki
  trussel: aki
  sources:
  - source: bingham
    forms:
    - form: áki
      parts:
      - label: adv.
        text: not.
  - source: sabatier
    forms:
    - form: aki
      parts:
      - label: adv.
        text: not.
      - label: ex.
        text: 'I aki kona: I cannot. (in Butaritari they say *I aki ni kona*.).'
      - label: note.
        text: sometimes *aki* follows a verb to lessen its meaning (nearly, a little, slightly, superficially).
      - label: ex.
        text: |-
          *e bo n aki, e bo maki (ma aki)*: it was only slightly touched.
          *e ongo maki*: he is a little deaf.
      - label: note.
        text: in an answer the verb is not always repeated.
      - label: ex.
        text: |-
          *ko aoraki? I aki*: are you sick?
          *I am not (sick).*
      - label: adv.
        text: without.
      - label: ex.
        text: '*e makuri n aki kua*: he works without being tired.'
      - label: see
        text: '[[tiaki]].'
      - label: ex.
        text: '*ka-aki (kaki)*: to throw away, to take away, to put aside, to remove, etc.'
      - label: see
        text: '[[kaki]].'
      - label: part.
        text: placed before a verb or a noun *aki* helps to form the opposite of that verb or noun.
      - label: ex.
        text: |-
          *te kona*: power; te aki kona: powerlessness.
          *te amarake*: eating; te aki amarake: fasting, not eating.
      - label: suf.
        text: to v.t. it forms the passive voice.
      - label: ex.
        text: '*kamatea, kamateaki*: to be killed.'
