- id: ake
  headword: ake
  trussel: ake
  sources:
  - source: bingham
    forms:
    - form: áke
      parts:
      - label: pron.
        text: plural of *are,* who, which yonder.
      - label: note.
        text: it is followed by *a*.
      - label: n.
        text: the ark (ENG).
    - form: ake
      parts:
      - label: vi.
        text: cleanse as a skull.
  - source: sabatier
    forms:
    - form: ake
      parts:
      - label: and
        text: '[[akeke]].'
      - label: pron.
        text: who, whom, that, which.
      - label: pl.
        text: of *are*.
      - label: note.
        text: followed by *a*.
    - form: ake
      homograph: 1
      parts:
      - label: v.
        text: to card, to comb, to cut to pieces, to hackle, to strip.
      - label: red.
        text: '*akeake*.'
      - label: ex.
        text: |-
          *akea, akeakea*: to take off thorns or fish bones, to strip off, to disentangle, to separate, to tease or comb.
          akea te benu: tease the *benu* (fibre).
          *akea te ika*: to rid the fish of bones.
          *akea te iranatu*: comb the hair.
    - form: ake
      homograph: 2
      parts:
      - label: n.
        text: ark (ENG).
      - label: ex.
        text: |-
          *Ana Ake Noa*: Noah's Ark.
          *te ake ni kamaiu*: the ark of salvation.
- id: akea
  headword: akea
  trussel: akea
  sources:
  - source: bingham
    forms:
    - form: akéa
      parts:
      - label: vt.
        text: remove bones from a fish or fowl.
    - form: akéa
      parts:
      - label: intj.
        text: exclamation of surprise or emotion.
      - label: n.
        text: nothing, not anything, space, void.
  - source: sabatier
    forms:
    - form: akea
      parts:
      - label: n.
        text: nothingness, absence, inexistence, emptiness, nothing, naught.
      - label: ex.
        text: |-
          *tai taekina akean te Atua*: don't speak of the inexistence of God.
          *ae akea*: nothingness, want of, absence of. a. not being, not having, empty, etc.
          *iai? akea*: is there any? there is none.
          *akea n ana auti*: he is absent from home.
          *akea kanoana*: it is empty, there is nothing in it.
          *n akea*: without, in the absence of...not.
      - label: vc.
        text: '*ka-akea (kakea)*: to deny the existence of..., to disown, to count as naught, to renounce,
          to deprecate, etc.'
      - label: n.
        text: '*te ka-akea*: renouncement, abjuration.'
    - form: akea
      homograph: 1
      parts:
      - label: intj.
        text: exclamation to show surprise.
      - label: ex.
        text: '*akea! akea ngai! akea ngaira!*: oh! dear me! what an affair!'
    - form: akea
      homograph: 2
      parts:
      - label: idiom.
        text: adv. nothing so...,.
      - label: ex.
        text: |-
          *akea n te kamimi*: nothing so astonishing.
          *akea ae akea*: nothing at all.
          *akea ba*: lo! and behold!
          *akea ba e a roko*: here he comes.
          *akea te amarake*: nothing to eat.
