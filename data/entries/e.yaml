- id: e
  headword: e
  trussel: e
  sources:
  - source: bingham
    forms:
    - form: e
      parts:
      - label: pron.
        text: he, she, it.
      - label: vi.
        text: be in a spasm of pain.
      - label: vi.
        text: lay or place a line on the ground to be used as a pattern in cutting or fitting a sail.
      - label: int.
        text: exclamation of disapproval.
  - source: sabatier
    forms:
    - form: e
      parts:
      - label: pron.
        text: it, he, she.
      - label: plural.
        text: '*a*.'
      - label: pref.
        text: to a number of compound words meaning to raise, to lift, to heave.
      - label: see
        text: '*emangoa*, [[euta]], [[ewe]]...'
    - form: e
      parts:
      - label: intj.
        text: of disapproval. conclusion of dance songs and of certain cries or yells.
    - form: e
      parts:
      - label: n.
        text: accent, tone, air, melody, pronunciation.
      - label: ex.
        text: |-
          *te e ni meang*: a northern accent.
          *te e ni maiaki*: a southern accent.
      - label: ex.
        text: '*e bure ana e*: he has a bad pronunciation, his tone is false.'
      - label: ex.
        text: |-
          *te e ni nimamanei*: a slow, sweet air.
          *te e ni maraki*: lamentation or plaintive air.
          *te e n tang*: a sad air.
      - label: vt.
        text: '*ea, kea, kekeia*: to lengthen the note, the air, the sound or accent in dance songs *(e...e...e...e...e...)*.'
      - label: vc.
        text: '*kaea*: to intensify the sound, etc.'
      - label: see
        text: '[[erake]], [[ebuaka|e-buaka]], [[eraoi|e-raoi]].'
    - form: e
      parts:
      - label: n.
        text: pattern, model, copy, design (for sail or clothes).
      - label: vt.
        text: |-
          *ea, ena (te ie, te kunikai)*; to take the measure for cutting out sail or clothes.
          *taona en te ie*: to peg out and put string around plan for cutting out a sail (lit.), lay out plan of sail.
    - form: e
      parts:
      - label: n.
        text: '*te kanoa n e, kanoan te e*: enlarging of sail corresponding to yard arm top and bottom
          (the plan on ground should show a curve).'
