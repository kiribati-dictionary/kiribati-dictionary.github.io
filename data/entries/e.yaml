    - form: eitei
      homograph: 1
      parts:
      - label: sn.
        text: _Gregata minor palmerstoni_.
      - label: n.
        text: Greater frigate bird, Pacific frigate bird (aa) (The adult male is dark brown to black all
          over, with a bluish grey bill and black, brown or pink feet. It is the darkest bird of either
          species and is thus easily identified. The female has a dark brown or blackish head, neck and
          upperparts and abdomen, but the throat and breast are white. Immatures have white or rusty colored
          heads and patches of white on the breast and abdomen; by the shape of these patches it is possible
          to tell whether the bird is a male or female.).
