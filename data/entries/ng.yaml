        text: _Phaethon lepturus dorotheae_.
      - label: n.
        text: <bird> white tailed tropic bird (This bird may be easily distinguished from the red tailed
          species by its two long central tail streamers, which are pure white and not as narrow as the
          red ones. The next adjacent feathers are also fairly long and there are eight shorter tail feathers,
          making twelve in all. There is more black on the wings and flanks with the rest of the plumage
          mainly white with or without the roseate tinge; The black eyestreaks are not so heavy. The bill
          is yellowish, base greyish; The legs and bases of the toes are yellowish or flesh color and
          the rest of the feet black.) (aa).
