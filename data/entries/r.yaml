          rubber. (ENG).
          *te raba n nano*: tube (in tyre). (ENG).
      - label: n.
        text: '*te raba n tinaniku*: tyre.'
    - form: raba
      homograph: 1
      parts:
      - label: na.
        text: appreciated, good, agreeable, pleasant.
      - label: ex.
        text: '*Ai raba ra*: How nice of you.'
      - label: idiom.
        text: '*ko raba, kam raba*: Thanks! How nice of you!'
      - label: ex.
        text: |-
          *E raba arou! E reke arou!*: I am lucky!
          *E raba arom*: You are lucky!
          vc *karaba*: to thank, to return thanks.
          *karaba uatao*: double thanks, a thousand thanks.
    - form: raba
      homograph: 2
      parts:
      - label: na.
        text: hidden, concealed, covered, obscure, mysterious, well-kept, guarded, caught.
      - label: ex.
        text: '*e raba*: we have got him, we hold him.'
      - label: vc.
        text: '*ka-raba*: to hide, to mask, to veil, to conceal, to hold.'
      - label: ex.
        text: '*karabaraba, kararaba*:'
      - label: red.
        text: a *raraba, rabaraba, rabanako*...
      - label: ex.
        text: |-
          *e raba*: it is caught, we hold it.
          *karaba konam*: hide your catch.
      - label: nv.
        text: '*I-karaba*: game of hide and seek, to play at...'
      - label: vt.
        text: '*karabana*: to cover oneself, to veil, to hide one''s nudity.'
      - label: ex.
        text: '*karabaniko*: cover yourself, clothe yourself.'
