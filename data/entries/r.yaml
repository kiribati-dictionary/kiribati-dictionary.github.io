- id: ra
  headword: ra
  trussel: ra
  sources:
  - source: bingham
    forms:
    - form: ra
      parts:
      - label: pron.
        text: what? (an interrogative pronoun following the noun).
      - label: ex.
        text: |-
          *te aomata ra?* what man?
          *baika ra?* what things?
      - label: adv.
        text: how.
      - label: ex.
        text: '*ai kamimi ra!* how wonderful!'
      - label: pron.
        text: our, a suffix pronoun.
      - label: ex.
        text: '*kawaira*: our path.'
      - label: n.
        text: one width of a mat-sail.
  - source: sabatier
    forms:
    - form: ra
      parts:
      - label: for.
        text: '*ara*.'
      - label: poss.
        text: suf. our.
      - label: ex.
        text: |-
          *kawaira*: our way.
          *tamara*: our father.
      - label: see
        text: '[[ara]].'
    - form: ra
      homograph: 1
      parts:
      - label: intj.
        text: suf. of exclamation or surprise.
      - label: ex.
        text: |-
          *ai tamaroa ra!*: how beautiful!
          *ai tena ra!*: how tight!
    - form: ra
      homograph: 2
      parts:
      - label: adj.
        text: 'suf. of interrogation: what? which?'
      - label: ex.
        text: |-
          *te aomata ra?*: which man?
          *baika ra?*: what things?
          *n te tabo ra?*: in what place?
          *au ra, am ra, ana ra*: my, thy, his, your, what?
          *tera?*: what?
          *am ra te bai anne?*: for what is that thing of yours?
          *rau? ram? rana?*: what? (meaning relationship).
          *ram te tei anne?*: what relation is that child to you?
          *bon taru*: he is my brother.
          *ran te taibora?*: which part of the table?
          *i rau? i ram? i rana?*:
      - label: adv.
        text: where in connection to me, you, him.
      - label: see
        text: '[[iraua|ira-ua]], [[iraman|ira man]].'
    - form: ra
      homograph: 3
      parts:
      - label: n.
        text: a piece, a strip, band put side by side to make a whole, a width. for ex. widths of material
          joined to make a sail.
      - label: ex.
        text: |-
          *ira ra am ie?*: how many widths on your sail?
          *te tao ra*: reducing size of sail by folding a width (in strong wind).
    - form: ra
      homograph: 4
      parts:
      - label: pref.
        text: nearly, not altogether, incomplete.
      - label: ex.
        text: |-
          *e ra koro*: nearly complete.
          *e ra bubua*: nearly 100.
    - form: ra
      homograph: 5
      parts:
      - label: a.
        text: |-
          bad, defective, improper, disagreeable, constrained, striped,.
          denuded, unfavourable, impure, imperfect, etc.
      - label: ex.
        text: |-
          *e nano ra*: he is discontented.
          *e teke-ra*: he is unlucky.
          *e tai ra*: it is not the time just now.
      - label: vt.
        text: '*tae-ra, taeraea*: to take off, to tear, to strip off what does not suit (for ex. branches).'
- id: ra-ni-mate
  headword: ra ni mate
  trussel: ranimate
  sources:
  - source: sabatier
    forms:
