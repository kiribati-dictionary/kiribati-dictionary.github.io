# Accepted corrections, applied on top of data/entries/ when the site is built.
# (data/entries/ is regenerated by convert_trussel.py, so never fix entries there.)
#
# Each correction replaces one piece of text in one source of one entry. The build
# stops with an error if `find` no longer appears exactly once, so nothing is fixed
# in the wrong place.
#
# kind: transcription   the site didn't match the printed dictionary; the fix restores it
#       editorial       the printed dictionary itself is wrong; the entry shows a note
#                       with what the dictionary originally said
#
# - entry: ngae                   # entry id: the last part of its address, /word/ngae/
#   source: sabatier              # bingham, sabatier, goo-banner, luomala or community
#   find: "satiating,filling"
#   replace: "satiating, filling"
#   kind: transcription
#   contributor: A. Contributor   # only if they asked to be credited
#   issue: 12                     # optional: GitHub issue number
